name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecución manual desde GitHub UI

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: 'app/yarn.lock'

      - name: 📦 Install Dependencies
        working-directory: ./app
        run: |
          yarn install --frozen-lockfile
          yarn prisma generate

      - name: 🧪 Run Build Test
        working-directory: ./app
        run: |
          yarn build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

      - name: 🚀 Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            cd ${{ secrets.HOSTINGER_APP_PATH }}
            git pull origin main
            yarn install --frozen-lockfile
            yarn prisma generate
            yarn prisma migrate deploy
            yarn build
            pm2 restart barrera-wallpaper || pm2 start yarn --name barrera-wallpaper -- start

      - name: ✅ Deployment Success
        if: success()
        run: echo "🎉 Deployment successful! App is now live at ${{ secrets.NEXTAUTH_URL }}"

      - name: ❌ Deployment Failed
        if: failure()
        run: echo "💥 Deployment failed! Check logs for details."
