name: Deploy to Hostinger (Optimized)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install Dependencies
        run: |
          yarn install --frozen-lockfile
          yarn prisma generate

      - name: Build
        run: yarn build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

      - name: Prepare Deployment Package
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_ENVIRONMENT: ${{ secrets.PAYPAL_ENVIRONMENT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        run: |
          cat << EOF > .env.production
          DATABASE_URL="$DATABASE_URL"
          NEXTAUTH_SECRET="$NEXTAUTH_SECRET"
          NEXTAUTH_URL="$NEXTAUTH_URL"
          STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY"
          STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY"
          STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET"
          PAYPAL_CLIENT_ID="$PAYPAL_CLIENT_ID"
          PAYPAL_CLIENT_SECRET="$PAYPAL_CLIENT_SECRET"
          PAYPAL_ENVIRONMENT="$PAYPAL_ENVIRONMENT"
          AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          AWS_REGION="$AWS_REGION"
          AWS_BUCKET_NAME="$AWS_BUCKET_NAME"
          SMTP_HOST="$SMTP_HOST"
          SMTP_PORT="$SMTP_PORT"
          SMTP_USER="$SMTP_USER"
          SMTP_PASS="$SMTP_PASS"
          ADMIN_EMAIL="$ADMIN_EMAIL"
          REPLICATE_API_TOKEN="$REPLICATE_API_TOKEN"
          GOOGLE_AI_STUDIO_API_KEY="$GOOGLE_AI_STUDIO_API_KEY"
          EOF
          tar -czf deploy.tar.gz \
            .next \
            public \
            package.json \
            yarn.lock \
            next.config.js \
            prisma \
            .env.production

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Package via SCP (with Retries)
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
        run: |
          # Intentar subir el archivo hasta 5 veces si hay timeout
          for i in {1..5}; do
            echo "Intento de subida $i..."
            scp -P $HOSTINGER_PORT -o ConnectTimeout=30 deploy.tar.gz $HOSTINGER_USERNAME@$HOSTINGER_HOST:/home/u425976741/domains/barrerawallpaper.com/nodejs/ && break || sleep 15
          done

      - name: Extract & Restart App
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
        run: |
          ssh -p $HOSTINGER_PORT -o ConnectTimeout=30 -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            $HOSTINGER_USERNAME@$HOSTINGER_HOST \
            "export NVM_DIR=\"\$HOME/.nvm\"; [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"; \
             cd /home/u425976741/domains/barrerawallpaper.com/nodejs; \
             rm -rf .next; rm -f package.json yarn.lock next.config.js; \
             echo 'Extrayendo paquete...'; \
             tar -xzf deploy.tar.gz; rm deploy.tar.gz; \
             mv .env.production .env; \
             echo 'Instalando dependencias...'; \
             yarn install --production --frozen-lockfile; \
             echo 'Sincronizando catalogo...'; \
             npx tsx scripts/seed-master.ts; \
             echo 'Reiniciando PM2...'; \
             if pm2 describe barrera-wallpaper > /dev/null 2>&1; \
             then pm2 restart barrera-wallpaper --update-env; \
             else pm2 start \"yarn start\" --name barrera-wallpaper && pm2 save; fi"

      - name: 🔍 Post-Deploy Smoke Check
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
        run: |
          sleep 5
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://barrerawallpaper.com/)
          echo "Homepage status: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Deploy verificado" || echo "⚠️ Homepage no responde 200"
