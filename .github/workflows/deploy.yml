name: Deploy to Hostinger (Optimized)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: 'app/yarn.lock'

      - name: Install Dependencies
        working-directory: ./app
        run: |
          yarn install --frozen-lockfile
          yarn prisma generate

      - name: Build
        working-directory: ./app
        run: yarn build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

      - name: Prepare Deployment Package
        working-directory: ./app
        run: |
          # Solo incluimos lo necesario para ejecutar la app
          tar -czf ../deploy.tar.gz \
            .next \
            public \
            package.json \
            yarn.lock \
            next.config.js \
            prisma \
            .env.example

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Package via SCP (with Retries)
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
        run: |
          # Intentar subir el archivo hasta 5 veces si hay timeout
          for i in {1..5}; do
            echo "Intento de subida $i..."
            scp -P $HOSTINGER_PORT -o ConnectTimeout=30 deploy.tar.gz $HOSTINGER_USERNAME@$HOSTINGER_HOST:/home/u425976741/domains/barrerawallpaper.com/nodejs/ && break || sleep 15
          done

      - name: Extract & Restart App
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /home/u425976741/domains/barrerawallpaper.com/nodejs

            # Descomprimir el paquete nuevo
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # Instalar solo dependencias de producción (rápido)
            yarn install --production --frozen-lockfile
            
            # Asegurar que el .env existe (si no, usar el backup o pedirlo)
            if [ ! -f ".env" ]; then
              cp .env.example .env
              echo "ADVERTENCIA: .env creado desde .env.example. Por favor configura las variables reales."
            fi

            # Reiniciar PM2
            if pm2 describe barrera-wallpaper > /dev/null 2>&1; then
              pm2 restart barrera-wallpaper --update-env
            else
              pm2 start "yarn start" --name barrera-wallpaper
              pm2 save
            fi
