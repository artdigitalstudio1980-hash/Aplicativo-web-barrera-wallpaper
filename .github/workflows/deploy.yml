name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecución manual desde GitHub UI

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: 'app/yarn.lock'

      - name: 📦 Install Dependencies
        working-directory: ./app
        run: |
          yarn install --frozen-lockfile
          yarn prisma generate

      - name: 🧪 Run Build Test
        working-directory: ./app
        run: |
          yarn build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

      - name: 🚀 Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            APP_PATH="${{ secrets.HOSTINGER_APP_PATH }}"

            if [ ! -d "$APP_PATH/.git" ]; then
              git clone https://github.com/artdigitalstudio1980-hash/barrera-wallpaper.git "$APP_PATH"
            fi

            cd "$APP_PATH"
            git pull origin main

            cd "$APP_PATH/app"

            printf 'DATABASE_URL=%s\nNEXTAUTH_SECRET=%s\nNEXTAUTH_URL=%s\n' \
              "$DATABASE_URL" "$NEXTAUTH_SECRET" "$NEXTAUTH_URL" > .env

            yarn install --frozen-lockfile
            yarn prisma generate
            yarn prisma db push
            yarn build

            if pm2 describe barrera-wallpaper > /dev/null 2>&1; then
              pm2 restart barrera-wallpaper
            else
              pm2 start "yarn start" --name barrera-wallpaper
              pm2 save
            fi

      - name: 📋 Deployment Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment successful! App is now live at ${{ secrets.NEXTAUTH_URL }}"
          else
            echo "Deployment failed! Check logs for details."
          fi
